version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: cineflow-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (use CLICKHOUSE_SECURE=false, PORT=8123 locally)
      - "9000:9000"   # native protocol
    environment:
      CLICKHOUSE_DB: cineflow
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  backend:
    build: ./backend
    container_name: cineflow-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_SECURE: "false"
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
